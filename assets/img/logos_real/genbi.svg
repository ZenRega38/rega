<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <style>
      .genbi-text { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #1a3c7a; }
      .genbi-sub { font-family: Arial, Helvetica, sans-serif; font-weight: 400; fill: #1a3c7a; font-size: 11px; }
    </style>
  </defs>
  <!-- Swirl elements - blue curves -->
  <g transform="translate(60, 60)">
    <!-- Blue swoosh 1 (top-right) -->
    <path d="M 0,-35 C 20,-35 35,-20 35,0 C 35,10 30,18 22,22 C 28,12 30,2 25,-8 C 20,-18 10,-28 0,-30 Z" fill="#2956a8"/>
    <!-- Blue swoosh 2 (bottom-left) -->
    <path d="M 0,35 C -20,35 -35,20 -35,0 C -35,-10 -30,-18 -22,-22 C -28,-12 -30,-2 -25,8 C -20,18 -10,28 0,30 Z" fill="#2956a8"/>
    <!-- Blue swoosh 3 (left-top) -->
    <path d="M -35,0 C -35,-20 -20,-35 0,-35 C 10,-35 18,-30 22,-22 C 12,-28 2,-30 -8,-25 C -18,-20 -28,-10 -30,0 Z" fill="#3b7dd8"/>
    <!-- Blue swoosh 4 (right-bottom) -->
    <path d="M 35,0 C 35,20 20,35 0,35 C -10,35 -18,30 -22,22 C -12,28 -2,30 8,25 C 18,20 28,10 30,0 Z" fill="#3b7dd8"/>
    <!-- Red dots -->
    <circle cx="0" cy="-38" r="4" fill="#e32726"/>
    <circle cx="38" cy="0" r="4" fill="#e32726"/>
    <circle cx="0" cy="38" r="4" fill="#e32726"/>
    <circle cx="-38" cy="0" r="4" fill="#e32726"/>
    <!-- Center red accent -->
    <path d="M -8,0 C -8,-5 -5,-8 0,-8 C 5,-8 8,-5 8,0 C 8,5 5,8 0,8 C -5,8 -8,5 -8,0 Z" fill="#e32726" opacity="0.6"/>
  </g>
  <!-- Text -->
  <text x="120" y="55" class="genbi-text" font-size="38">GenBI</text>
  <text x="120" y="75" class="genbi-sub">Generasi Baru Indonesia</text>
</svg>
